[package]
name = "pele-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
captured-sankey = ["pele/web-host-sankey"]

[dependencies]
pele = { workspace = true, features = ["web-host-er"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
